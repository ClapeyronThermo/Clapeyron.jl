name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
  push:
    paths-ignore:
      - 'docs/**'
      - 'examples/**'

permissions:
  actions: write   # needed for julia-actions/cache to delete old caches
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 'lts'
          - os: macOS-latest
            arch: aarch64
            version: '1'
          - os: macOS-latest
            arch: aarch64
            version: 'nightly'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Build package (instantiate & precompile)
        uses: julia-actions/julia-buildpkg@latest

      # ----- Standard tests: all platforms -----
      - name: Run test suite
        if: matrix.os != 'ubuntu-latest' || matrix.version != '1'
        uses: julia-actions/julia-runtest@latest

      # ----- Extension tests: ONLY Ubuntu + Julia 1 -----
      - name: Run test suite (with extensions)
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        shell: julia --color=yes --depwarn=yes --inline=yes --project=test/extensions {0}
        run: |
          import Pkg
          Pkg.test(coverage = "@" * ENV["GITHUB_WORKSPACE"], julia_args = ["--check-bounds=yes"])
      # ----- Coverage (runs on all jobs) -----
      - name: Process coverage data
        uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}